# FOUR COLOR - Windows 11 / MSVC x64 build, test and package.
#
# Its job is to prove the code compiles and the DSP suite passes on the
# platform the product actually targets (Cubase 15 on Windows), and to hand
# back a ready installer folder - which no machine in the development
# workspace can do.
#
# WHERE THIS RUNS
# ---------------
# On GitHub's hosted Windows runners, which are free and unmetered because this
# repository is PUBLIC. That is the whole reason it was made public: hosted
# minutes are billed on private repositories and this account's jobs had been
# refused since 2026-08-06, so no push could produce a Windows binary at all.
#
# It briefly targeted a self-hosted runner on the owner's own PC, which was the
# only free route while the repository was private. That is now removed on
# purpose and MUST NOT come back while this repository is public: a public repo
# lets anyone open a pull request, and a pull request runs the workflow. Against
# a self-hosted runner that means a stranger executing arbitrary code on the
# owner's Windows machine. Hosted runners are disposable VMs, so the same pull
# request can only burn a few minutes of somebody else's hardware.
#
# Everything is pinned: an unpinned runner image or JUCE branch turns a red
# build into "something upstream moved", which is the least useful failure.

name: windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One build per branch. A newer push makes the one in flight pointless.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022          # pinned image, not windows-latest

    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
      - name: Check out FOUR COLOR
        uses: actions/checkout@v4

      - name: Check out JUCE 9 (pinned)
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          # The exact JUCE 9 commit this workspace develops against (2026-07-22).
          ref: 857aab9c4eb3084af639a380a693dcec7d728b73
          path: JUCE

      - name: Configure
        shell: cmd
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DFOURCOLOR_COPY_AFTER_BUILD=OFF
          -DFOURCOLOR_WERROR=ON

      - name: Build
        shell: cmd
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run the DSP and state suite
        shell: cmd
        env:
          # A hosted runner is a shared two-core VM with software rendering. Its
          # CPU numbers say as little about the shipped plug-in as an
          # unoptimised build's do - the same binary has reported 19.8x realtime
          # on a quiet machine and 4.1x on a contended one - so the CPU budgets
          # are reported here and enforced on a quiet machine before release.
          # Every correctness check stays enforced.
          FOURCOLOR_SKIP_PERF: 1
        # No continue-on-error. It was here because one acceptance check was
        # knowingly red, which meant a genuine regression could not turn this
        # job red either - the safety net was switched off to tolerate a known
        # hole. The suite is at 0 failures as of the RC round, so a non-zero
        # exit is information again and must stop the build.
        run: build\FourColorTests_artefacts\${{ matrix.config }}\FourColorTests.exe

      - name: Package the installer folder
        if: matrix.config == 'Release'
        shell: cmd
        run: |
          if exist dist\FourColor-windows-x64 rmdir /s /q dist\FourColor-windows-x64
          mkdir dist\FourColor-windows-x64
          xcopy /e /i /y build\FourColor_artefacts\Release\VST3\FourColor.vst3 dist\FourColor-windows-x64\FourColor.vst3\
          if exist build\FourColor_artefacts\Release\Standalone\FourColor.exe copy /y build\FourColor_artefacts\Release\Standalone\FourColor.exe dist\FourColor-windows-x64\
          copy /y packaging\INSTALL-FOUR-COLOR.bat dist\FourColor-windows-x64\
          copy /y packaging\UNINSTALL-FOUR-COLOR.bat dist\FourColor-windows-x64\
          copy /y packaging\README-WINDOWS.txt dist\FourColor-windows-x64\
          if not exist dist\FourColor-windows-x64\FourColor.vst3\Contents\x86_64-win\FourColor.vst3 exit /b 1

      - name: Upload artefacts
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: FourColor-windows-x64
          path: dist/FourColor-windows-x64/
          if-no-files-found: error
