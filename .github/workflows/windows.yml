# FOUR COLOR - Windows 11 / MSVC x64 build and test.
#
# This runs the same steps as scripts/build-windows.bat. Its job is to prove the
# code compiles and the DSP suite passes on the platform the product actually
# targets (Cubase 15 on Windows), which no machine in this workspace can do.
#
# Everything is pinned: an unpinned runner image or JUCE branch turns a red
# build into "something upstream moved", which is the least useful failure.

name: windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022          # pinned image, not windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]

    steps:
      - name: Check out FOUR COLOR
        uses: actions/checkout@v4

      - name: Check out JUCE 9 (pinned)
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          # The exact JUCE 9 commit this workspace develops against (2026-07-22).
          ref: 857aab9c4eb3084af639a380a693dcec7d728b73
          path: JUCE

      - name: Configure
        shell: cmd
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DFOURCOLOR_COPY_AFTER_BUILD=OFF
          -DFOURCOLOR_WERROR=ON

      - name: Build
        shell: cmd
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Run the DSP and state suite
        shell: cmd
        # One check is knowingly red (docs/REPORT-RC.md section 5), so the suite
        # exits non-zero by design. continue-on-error keeps the build red - the
        # information - while still letting the artefact upload happen.
        continue-on-error: true
        run: build\FourColorTests_artefacts\${{ matrix.config }}\FourColorTests.exe

      - name: Package the installer folder
        if: matrix.config == 'Release'
        shell: cmd
        run: |
          mkdir dist\FourColor-windows-x64
          xcopy /e /i /y build\FourColor_artefacts\Release\VST3\FourColor.vst3 dist\FourColor-windows-x64\FourColor.vst3\
          if exist build\FourColor_artefacts\Release\Standalone\FourColor.exe copy /y build\FourColor_artefacts\Release\Standalone\FourColor.exe dist\FourColor-windows-x64\
          copy /y packaging\INSTALL-FOUR-COLOR.bat dist\FourColor-windows-x64\
          copy /y packaging\UNINSTALL-FOUR-COLOR.bat dist\FourColor-windows-x64\
          copy /y packaging\README-WINDOWS.txt dist\FourColor-windows-x64\
          if not exist dist\FourColor-windows-x64\FourColor.vst3\Contents\x86_64-win\FourColor.vst3 exit /b 1

      - name: Upload artefacts
        if: always() && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: FourColor-windows-x64
          path: dist/FourColor-windows-x64/
          if-no-files-found: error
